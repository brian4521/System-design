services:
  nginx:
    image: nginx
    ports:
      - 8080:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

  gateway1:
    build: ./backend/gateways
    env_file:
      - ./backend/gateways/.env
    environment:
      - ser_name=first gateway  
    ports:
      - 3001:3000

  gateway2:
    build: ./backend/gateways
    env_file:
      - ./backend/gateways/.env 
    environment:
      - ser_name=second gateway  
    ports:
      - 3002:3000

  auth-service:
    build: ./backend/services/auth
    env_file:
      - ./backend/services/auth/.env
    ports:
      - 5001:3001 

  order-service:
    build: ./backend/services/order
    env_file:
      - ./backend/services/order/.env
    ports:
      - 5002:3002   

  product-service:
    build: ./backend/services/product
    env_file:
      - ./backend/services/product/.env
    ports:
      - 5003:3003              

         